name = "cf-kefu-chat"
main = "src/index.js"
compatibility_date = "2025-04-01"
workers_dev = true

# 变量（非机密）
[vars]
SHOP_NAME = "在线客服"
MAX_IMAGE_MB = "5"
RECALL_WINDOW_SEC = "120"
AGENT_NAME = "客服小旗"
WELCOME_MESSAGE = "您好！欢迎来到小旗搭建在线客服，请问有什么可以帮您？"

[observability]
enabled = true

# D1 数据库：先执行 wrangler d1 create cf_kefu 拿到 database_id 填到这里
[[d1_databases]]
binding = "DB"
database_name = "kefu01_db"
database_id = "fb1b57cc-5b47-4439-8ca6-3ca068abb346"
migrations_dir = "migrations"

# R2 对象存储：先执行 wrangler r2 bucket create cf-kefu-files
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "kefu01-files"

# 静态资源（public 目录）：Worker 优先接管请求，再回落到静态资源
[assets]
directory = "./public"
binding = "ASSETS"
