<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<title>在线客服</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="page-visitor">
  <div class="visitor-shell">
    <header class="chat-head">
      <div class="brand-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 01-9 8.4 9 9 0 01-3.8-.9L3 20l1.1-3.3A8.4 8.4 0 0112 3.1a8.4 8.4 0 019 8.4z"/>
        </svg>
      </div>
      <div class="chat-head-titles">
        <div class="chat-head-title" id="shop-name">在线客服</div>
        <div class="chat-head-sub">
          <span class="status-dot" aria-hidden="true"></span>
          <span>在线 · 留言后客服会尽快回复</span>
        </div>
      </div>
      <button class="head-link" id="contact-open" type="button" hidden>留联系方式</button>
    </header>

    <div class="contact-panel" id="contact-panel" hidden>
      <div class="contact-head">
        <span>留下联系方式，方便我们主动联系您（都可以不填）</span>
        <button class="contact-close" id="contact-close" type="button" aria-label="收起">✕</button>
      </div>
      <div class="contact-grid">
        <input class="field-input" id="c-phone" maxlength="20" placeholder="手机号">
        <input class="field-input" id="c-wechat" maxlength="40" placeholder="微信号">
        <input class="field-input" id="c-qq" maxlength="20" placeholder="QQ号">
        <input class="field-input" id="c-email" maxlength="60" placeholder="邮箱">
      </div>
      <div class="contact-foot">
        <button class="btn-primary contact-save" id="contact-save" type="button">提交</button>
        <span class="contact-note">仅用于客服联系，不会外泄</span>
      </div>
      <div class="login-error" id="contact-error"></div>
    </div>

    <div id="chat-host" class="chat-host">
      <div class="chat-empty"><p>正在连接客服…</p></div>
    </div>
  </div>

  <noscript>
    <div style="padding:24px;text-align:center">请开启浏览器脚本后再使用在线客服。</div>
  </noscript>

<script type="module">
import { createChatHost } from '/assets/chat.js';

const TOKEN_KEY = 'kefu_visitor_token';

// 被别的网站用 iframe 嵌入时，浏览器可能禁掉 localStorage，这里做内存兜底
const memStore = {};
const store = {
  get(key) {
    try {
      return localStorage.getItem(key) || '';
    } catch {
      return memStore[key] || '';
    }
  },
  set(key, value) {
    try {
      localStorage.setItem(key, value);
    } catch {
      memStore[key] = value;
    }
  },
};
const host = document.getElementById('chat-host');
let visitorToken = '';
let contactEnabled = false;

function showError(message) {
  host.innerHTML = `
    <div class="chat-empty">
      <p>${message}</p>
      <button class="btn-primary" style="width:auto;padding:8px 18px;margin:14px auto 0" id="retry">重新连接</button>
    </div>`;
  const btn = host.querySelector('#retry');
  if (btn) btn.addEventListener('click', () => location.reload());
}

const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

function refFromQuery() {
  try {
    return new URLSearchParams(location.search).get('ref') || '';
  } catch {
    return '';
  }
}

async function createSession() {
  let lastError = null;
  for (let i = 0; i < 3; i++) {
    try {
      const res = await fetch('/api/session', {
        method: 'POST',
        headers: { 'content-type': 'application/json' },
        body: JSON.stringify({
          token: store.get(TOKEN_KEY),
          referer: refFromQuery() || document.referrer || location.href,
        }),
        cache: 'no-store',
      });
      const data = await res.json().catch(() => ({}));
      if (!res.ok) throw new Error(data.message || `连接失败（${res.status}）`);
      return data;
    } catch (e) {
      lastError = e;
      if (i < 2) await sleep(800 * (i + 1));
    }
  }
  throw lastError || new Error('连接失败');
}

async function boot() {
  try {
    const data = await createSession();
    store.set(TOKEN_KEY, data.token);
    if (data.shop) document.getElementById('shop-name').textContent = data.shop;

    visitorToken = data.token;
    contactEnabled = !!data.contactEnabled;
    document.getElementById('contact-open').hidden = !contactEnabled;

    host.innerHTML = '';
    createChatHost({
      root: host,
      role: 'visitor',
      token: data.token,
      convId: data.conv.id,
      peerAvatarUrl: '/api/avatar/agent',
      emptyText: '您好，有任何问题都可以在这里留言，客服会尽快回复（支持图片和表情）',
    });
  } catch (e) {
    showError(e.message || '网络连接失败，请稍后重试');
  }
}

const contactPanel = document.getElementById('contact-panel');
const contactError = document.getElementById('contact-error');

document.getElementById('contact-open').addEventListener('click', () => {
  contactPanel.hidden = !contactPanel.hidden;
});

document.getElementById('contact-close').addEventListener('click', () => {
  contactPanel.hidden = true;
});

document.getElementById('contact-save').addEventListener('click', async () => {
  contactError.style.display = 'none';
  const payload = {
    phone: document.getElementById('c-phone').value.trim(),
    wechat: document.getElementById('c-wechat').value.trim(),
    qq: document.getElementById('c-qq').value.trim(),
    email: document.getElementById('c-email').value.trim(),
  };
  const btn = document.getElementById('contact-save');
  btn.disabled = true;
  try {
    const res = await fetch('/api/contact', {
      method: 'POST',
      headers: { 'content-type': 'application/json', 'x-visitor-token': visitorToken },
      body: JSON.stringify(payload),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(data.message || `提交失败（${res.status}）`);
    contactPanel.hidden = true;
    ['c-phone', 'c-wechat', 'c-qq', 'c-email'].forEach((id) => {
      document.getElementById(id).value = '';
    });
    const ok = document.createElement('div');
    ok.className = 'contact-toast';
    ok.textContent = '已收到您的联系方式，客服会尽快联系您';
    document.body.appendChild(ok);
    setTimeout(() => ok.remove(), 2600);
  } catch (e) {
    contactError.textContent = e.message;
    contactError.style.display = 'block';
  } finally {
    btn.disabled = false;
  }
});

boot();
</script>
</body>
</html>
