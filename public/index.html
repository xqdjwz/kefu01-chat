<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>在线客服</title>
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body class="page-visitor">
  <div class="visitor-shell">
    <header class="chat-head">
      <div class="brand-avatar" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21 11.5a8.4 8.4 0 01-9 8.4 9 9 0 01-3.8-.9L3 20l1.1-3.3A8.4 8.4 0 0112 3.1a8.4 8.4 0 019 8.4z"/>
        </svg>
      </div>
      <div class="chat-head-titles">
        <div class="chat-head-title" id="shop-name">在线客服</div>
        <div class="chat-head-sub">
          <span class="status-dot" aria-hidden="true"></span>
          <span>客服在线 · 通常几分钟内回复</span>
        </div>
      </div>
    </header>

    <div id="chat-host" class="chat-host"></div>
  </div>

  <noscript>
    <div style="padding:24px;text-align:center">请开启浏览器脚本后再使用在线客服。</div>
  </noscript>

<script type="module">
import { createChatHost } from '/assets/chat.js';

const TOKEN_KEY = 'kefu_visitor_token';
const host = document.getElementById('chat-host');

function showError(message) {
  host.innerHTML = `
    <div class="chat-empty">
      <p>${message}</p>
      <button class="btn-primary" style="width:auto;padding:8px 18px;margin:14px auto 0" id="retry">重新连接</button>
    </div>`;
  const btn = host.querySelector('#retry');
  if (btn) btn.addEventListener('click', () => location.reload());
}

async function boot() {
  try {
    const token = localStorage.getItem(TOKEN_KEY) || '';
    const res = await fetch('/api/session', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ token }),
    });
    if (!res.ok) throw new Error('无法建立会话');
    const data = await res.json();

    localStorage.setItem(TOKEN_KEY, data.token);
    if (data.shop) document.getElementById('shop-name').textContent = data.shop;

    host.innerHTML = '';
    createChatHost({
      root: host,
      role: 'visitor',
      token: data.token,
      convId: data.conv.id,
      emptyText: '您好，有任何问题都可以在这里留言，客服会尽快回复',
    });
  } catch (e) {
    showError('网络连接失败，请稍后重试');
  }
}

boot();
</script>
</body>
</html>
